<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Color Clock</title>
  <style>
    :root { --bg: #000; }
    html, body { height: 100%; margin: 0; }
    body { background: var(--bg); display: grid; place-items: center; }

    .clock {
      width: min(92vmin, 520px);
      aspect-ratio: 1 / 1;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 0;
      border-radius: 24px;
      overflow: hidden;
    }
    .band { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div class="clock" id="clock" aria-label="Current time as colors">
    <div class="band" id="b0"></div>
    <div class="band" id="b1"></div>
    <div class="band" id="b2"></div>
  </div>

  <script>
    // One color per digit, 0 through b. The hour band uses all twelve;
    // the two minute bands use the same colors, just never 10 (a) or 11 (b).
    const palette = [
      "#E40303", // 0
      "#F55A00", // 1
      "#FF8C00", // 2
      "#FFBB00", // 3
      "#FFED00", // 4
      "#8DB813", // 5
      "#008026", // 6
      "#00AAAA", // 7
      "#0088CC", // 8
      "#004DFF", // 9
      "#3A34D6", // a (10)
      "#6425CB"  // b (11)
    ];

    const digits = "0123456789ab";

    const clock = document.getElementById("clock");
    const bands = [
      document.getElementById("b0"),
      document.getElementById("b1"),
      document.getElementById("b2")
    ];

    function bandValues(date = new Date()) {
      const MM = date.getMinutes();
      return [
        date.getHours() % 12, // hour 0..b, the same for am and pm
        Math.floor(MM / 10),  // tens of minutes 0..5
        MM % 10               // ones of minutes 0..9
      ];
    }

    function render() {
      const values = bandValues();
      values.forEach((v, i) => {
        bands[i].style.background = palette[v];
      });

      const label = values.map(v => digits[v]).join("");
      document.title = `Color Clock (${label})`;
      clock.setAttribute("aria-label", `Current time ${label} as colors`);
    }

    function scheduleNextMinuteTick() {
      const now = new Date();
      const msUntilNextMinute =
        (60 - now.getSeconds()) * 1000 - now.getMilliseconds();

      setTimeout(() => {
        render();
        // After the first alignment, tick every minute.
        setInterval(render, 60 * 1000);
      }, msUntilNextMinute);
    }

    render();
    scheduleNextMinuteTick();
  </script>
</body>
</html>
